<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PulseMDT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0b0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      gap: 20px;
      -webkit-app-region: drag;
      user-select: none;
    }
    .logo {
      width: 72px; height: 72px;
      background: url('mark.png') center / cover no-repeat;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: 900; color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      animation: fadein 0.3s ease both;
    }
    @keyframes pop {
      0%   { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1);   opacity: 1; }
    }
    .name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 22px; font-weight: 600; color: #f4f5f7;
      letter-spacing: -0.5px;
      animation: fadein 0.4s 0.15s ease both;
    }
    .sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 12px; color: #475569;
      letter-spacing: 0.12em; text-transform: uppercase;
      animation: fadein 0.4s 0.2s ease both;
    }
    @keyframes fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .bar {
      width: 140px; height: 2px;
      background: #262a35;
      border-radius: 2px;
      overflow: hidden;
      animation: fadein 0.4s 0.3s ease both;
    }
    .bar-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #1090b3, #22b8dc);
      border-radius: 2px;
      animation: load 1.4s 0.3s ease-in-out forwards;
    }
    @keyframes load { 0% { width:0% } 60% { width:70% } 100% { width:95% } }
    @media (prefers-reduced-motion: reduce) {
      .logo, .name, .sub, .bar { animation: none; }
      .bar-fill { animation: none; width: 60%; }
    }
  </style>
</head>
<body>
  <div class="logo" role="img" aria-label="PulseMDT"></div>
  <div class="name">PulseMDT</div>
  <div class="sub">Connecting to server&hellip;</div>
  <div class="bar"><div class="bar-fill"></div></div>
</body>
</html>
