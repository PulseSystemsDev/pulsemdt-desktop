<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulseMDT - Reconnecting</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #14151a;
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      gap: 24px;
      -webkit-app-region: drag;
      user-select: none;
    }
    .logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #2f9bd6, #1f6f9e);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 800;
      color: white;
      letter-spacing: -1px;
      box-shadow: 0 8px 32px rgba(47,155,214,0.25);
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      color: #e2e8f0;
      letter-spacing: -0.3px;
    }
    p {
      font-size: 13px;
      color: #64748b;
      text-align: center;
      max-width: 280px;
      line-height: 1.6;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 2px solid #2d303a;
      border-top-color: #2f9bd6;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .dot {
      display: inline-block;
      animation: dot 1.4s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dot {
      0%, 80%, 100% { opacity: 0.2; }
      40% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 2.5s; }
      .dot { animation: none; opacity: 1; }
    }
    #url {
      font-size: 11px;
      color: #475569;
      font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
      margin-top: -8px;
    }
  </style>
</head>
<body>
  <div class="logo">P</div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
    <h1>Reconnecting<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></h1>
    <p>Unable to reach your PulseMDT server. Retrying automatically.</p>
    <div id="url"></div>
  </div>
  <div class="spinner"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const url = params.get('url');
    if (url) document.getElementById('url').textContent = url;
  </script>
</body>
</html>
